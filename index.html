<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTCC Duplicate</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Header / Profile Section -->
        <header>
            <div class="profile-frame">
                <!-- INSERT_PROFILE_IMAGE_URL_HERE -->
                <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">
            </div>
            <h1>BTCC Official</h1>
            <p>Cryptocurrency Exchange & Trading</p>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tab-nav">
            <button class="tab-link active" onclick="openTab(event, 'links')">Links</button>
            <button class="tab-link" onclick="openTab(event, 'about')">About</button>
        </nav>

        <!-- Tab 1: Links -->
        <section id="links" class="tab-content active">
            <div class="link-list">
                <!-- Duplicate these for more buttons -->
                <a href="INSERT_URL_1" class="card">
                    <i class="fa-solid fa-globe"></i>
                    <span>Official Website</span>
                </a>
                <a href="INSERT_URL_2" class="card">
                    <i class="fa-brands fa-telegram"></i>
                    <span>Join Telegram</span>
                </a>
                <a href="INSERT_URL_3" class="card">
                    <i class="fa-brands fa-twitter"></i>
                    <span>Twitter / X</span>
                </a>
            </div>
        </section>

        <!-- Tab 2: About / Interactive Content -->
        <section id="about" class="tab-content">
            <div class="about-container">
                <div class="about-card">
                    <h3>About Us</h3>
                    <!-- INSERT_DESCRIPTION_HERE -->
                    <p>Enter your business description or personal bio here. This section is designed for longer text content.</p>
                </div>
                
                <div class="gallery">
                    <!-- INSERT_GALLERY_IMAGE_URL_HERE -->
                    <img src="https://via.placeholder.com/300x150" alt="Work 1">
                </div>
            </div>
        </section>

        <!-- Social Footer -->
        <footer>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-discord"></i></a>
                <a href="#"><i class="fa-envelope"></i></a>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
