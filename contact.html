<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | BTCC Church</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="give.html">Give</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

        <section class="content-box">
            <h2>Get in Touch</h2>
            <p>Have a question or need prayer? Send us a message and our team will get back to you.</p>
            
            <form class="contact-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Message / Prayer Request</label>
                    <textarea placeholder="Write your message here..." rows="5" required></textarea>
                </div>
                <button type="submit" class="action-btn">Send Message</button>
            </form>

            <div class="social-footer">
                <p>Follow us on Social Media</p>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
