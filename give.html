<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Give | BTCC Church</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="give.html" class="active">Give</a>
        </nav>

        <section class="content-box">
            <h2>Tithing & Giving</h2>
            <p>Your generosity helps us continue our mission. You can give securely via the link below:</p>
            <a href="YOUR_PAYMENT_LINK" class="give-btn">Give via GCash / PayPal</a>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #334155;">

            <h3>Contact Us</h3>
            <form class="contact-form">
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="How can we pray for you?" rows="4"></textarea>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </div>
</body>
</html>
